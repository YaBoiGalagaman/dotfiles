[[mgr.prepend_keymap]]
on = "<S-Up>"
run = "arrow -5"
desc = "Move cursor up 5"

[[mgr.prepend_keymap]]
on = "<S-Down>"
run = "arrow 5"
desc = "Move cursor down 5"

[[mgr.prepend_keymap]]
on = ["b", "c"]
run = 'shell -- code "$PWD"'
desc = "Begin code: open VSCode here"


[[mgr.prepend_keymap]]
on = ["b", "z"]
run = "plugin compress"
desc = "Begin Zipping: Compress selected files"
