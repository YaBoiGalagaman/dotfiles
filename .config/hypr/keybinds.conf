# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = CTRL, KP_ADD, killactive,
bind = $mainMod, X, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, dolphin
# bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, End, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen
bind = $mainMod, C, exec, code

preserve_split = true

# Fix for dolphin thing
bind = $mainMod, PAUSE, exec, XDG_MENU_PREFIX=arch- kbuildsycoca6



# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d


#/# bind = Super+Shift, ←/↑/→/↓,, # Move in direction
bind = Super+Shift, Left, movewindow, l # [hidden]
bind = Super+Shift, Right, movewindow, r # [hidden]
bind = Super+Shift, Up, movewindow, u # [hidden]
bind = Super+Shift, Down, movewindow, d # [hidden]


# Resize mode with SUPER + ALT + Arrow Keys
bind = SUPER ALT, right, resizeactive, 40 0
bind = SUPER ALT, left,  resizeactive, -40 0
bind = SUPER ALT, up,    resizeactive, 0 -40
bind = SUPER ALT, down,  resizeactive, 0 40

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 87, workspace, 1
bind = $mainMod, 88, workspace, 2
bind = $mainMod, 89, workspace, 3
bind = $mainMod, 83, workspace, 4
bind = $mainMod, 84, workspace, 5
bind = $mainMod, 85, workspace, 6
bind = $mainMod, 79, workspace, 7
bind = $mainMod, 80, workspace, 8
bind = $mainMod, 81, workspace, 9
# bind = $mainMod, 0, workspace, 10




# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 87, movetoworkspace, 1
bind = $mainMod SHIFT, 88, movetoworkspace, 2
bind = $mainMod SHIFT, 89, movetoworkspace, 3
bind = $mainMod SHIFT, 83, movetoworkspace, 4
bind = $mainMod SHIFT, 84, movetoworkspace, 5
bind = $mainMod SHIFT, 85, movetoworkspace, 6
bind = $mainMod SHIFT, 79, movetoworkspace, 7
bind = $mainMod SHIFT, 80, movetoworkspace, 8
bind = $mainMod SHIFT, 81, movetoworkspace, 9
# bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = ALT, TAB , togglespecialworkspace, magic
bind = $mainMod SHIFT, TAB, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
# bindl = , XF86AudioNext, exec, playerctl next
# bindl = , XF86AudioPause, exec, playerctl play-pause
# bindl = , XF86AudioPlay, exec, playerctl play-pause
# bindl = , XF86AudioPrev, exec, playerctl previous

bind = , XF86AudioPlay, exec, playerctl-smart play-pause
bind = , XF86AudioNext, exec, playerctl-smart next
bind = , XF86AudioPrev, exec, playerctl-smart previous
bind = , XF86AudioStop, exec, playerctl-smart stop





# Launch Firefox
bind = SUPER, B, exec, firefox

# Launch Spotify
bind = SUPER, S, exec, spotify

# Launch discord
bind = SUPER, D, exec,flatpak run com.discordapp.Discord --enable-features=UseOzonePlatform --ozone-platform=wayland XDG_SESSION_TYPE=x11

# Rofi Search
bind = SUPER, R, exec, rofi -show drun

# Rofi Kando'd
bind = CTRL, SPACE, exec, ~/.config/rofi/scripts/rofi_config.sh

# Toggle Floating Window
bind = SUPER, Q, togglefloating, 

# Clipboard Manager
bind = SUPER, V, exec, copyq toggle

# Hyperspeedcube
# bind = SUPER, H, exec, WAYLAND_DISPLAY= XDG_SESSION_TYPE= FILEPATH TO HYPERSPEEDCUBE HERE

# MC7D KB
# bind = SUPER, 7, exec, env WINEPREFIX="$HOME/.local/share/wineprefixes/dotnet35" wine "FILEPATH TO MC7D.exe HERE"

# KDE Text
bind = SUPER, K, exec, kdeconnect-sms


# Quickshell Overview
bind = Super, TAB, exec, qs ipc -c overview call overview toggle


# ================ Screenshot Stuff ================

# Hyprshot region and copy to clipboard
bind = ,Print,exec,hyprshot -m region --clipboard-only



# Hyprshot region, save to disk, and copy to clipboard
bind = SUPER,Print,exec,hyprshot -m region -o ~/Pictures/Screenshots/




# ================ Mouse Sensitivity  ================

input {
    accel_profile = flat
    sensitivity = 0.6
}

# old sensitivity value = 0.55
